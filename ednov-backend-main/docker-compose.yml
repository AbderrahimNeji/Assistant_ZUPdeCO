version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ednov_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ednov
      POSTGRES_PASSWORD: ednov_dev
      POSTGRES_DB: ednov
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ednov']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ednov_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ednov:ednov_dev@postgres:5432/ednov
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
