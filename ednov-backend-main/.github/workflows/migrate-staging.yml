name: Migrate Staging DB

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # Ne jamais annuler un deploy en cours (migrations atomiques)

jobs:
  deploy-staging:
    name: Run migrations → Staging DB
    runs-on: ubuntu-latest
    environment: staging

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      DATABASE_SSL: true
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations → Staging
        run: npm run migration:run

      - name: Show migration status
        run: npm run migration:show

      # ─── Déploiement ──────────────────────────────────────────────────────────
      # Décommentez le bloc correspondant à votre hébergeur.
      #
      # ── Render ──
      # - name: Trigger Render deploy
      #   run: |
      #     curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
      #
      # ── Railway ──
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: ${{ secrets.RAILWAY_SERVICE_STAGING }}
      #
      # ── Fly.io ──
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - name: Deploy to Fly.io
      #   run: flyctl deploy --remote-only --app ${{ secrets.FLY_APP_STAGING }}
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      #
      # ── Docker / VPS ──
      # - name: Build & push Docker image
      #   run: |
      #     docker build -t ${{ secrets.REGISTRY }}/ednov-backend:${{ github.sha }} .
      #     docker push ${{ secrets.REGISTRY }}/ednov-backend:${{ github.sha }}
      # ─────────────────────────────────────────────────────────────────────────

      - name: Notify deploy success
        if: success()
        run: echo "✅ Staging déployé — commit ${{ github.sha }}"

      - name: Notify deploy failure
        if: failure()
        run: echo "❌ Deploy staging échoué — vérifiez les migrations !"
